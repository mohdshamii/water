  .navlink { transition: background .15s ease, color .15s ease; }

  .card { background:#fff; border-radius: 14px; box-shadow: 0 2px 14px rgba(6,42,77,0.07); }
  .card:hover.hoverable { box-shadow: 0 8px 28px rgba(6,42,77,0.12); }

  .kpi-value { font-variant-numeric: tabular-nums; }

  .district-shape { cursor: pointer; stroke: #ffffff; stroke-width: 1.5; transition: filter .15s ease, transform .15s ease; }
  .district-shape:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .district-shape.selected { stroke: #062A4D; stroke-width: 3; }

  .modal-backdrop { background: rgba(6,42,77,0.45); backdrop-filter: blur(2px); }

  input[type=range] { -webkit-appearance: none; height: 6px; border-radius: 999px; background: #e2e9f1; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#1683D8; border:3px solid #fff; box-shadow:0 1px 6px rgba(0,0,0,.25); cursor:pointer; }

  .toggle-switch { width:40px; height:22px; border-radius:999px; background:#d7e2ee; position:relative; cursor:pointer; transition:background .2s; flex-shrink:0; }
  .toggle-switch.on { background:#27AE60; }
  .toggle-switch .dot { position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .toggle-switch.on .dot { left:20px; }

  .tag { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; }

  .sidebar-collapsed .nav-label, .sidebar-collapsed .brand-text, .sidebar-collapsed .sidebar-footer-text { display:none; }
  .sidebar-collapsed { width: 76px !important; }
  .sidebar-collapsed .navlink { justify-content: center; }

  #aiFab { transition: transform .15s ease; }
  #aiFab:hover { transform: scale(1.06); }

  .toast { animation: toastIn .25s ease, toastOut .4s ease 2.6s forwards; }
  @keyframes toastIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes toastOut { to{opacity:0; transform:translateY(-8px);} }

  @media (max-width: 1024px) {
    #sidebar { position: fixed; z-index: 50; height: 100vh; transform: translateX(-100%); transition: transform .25s ease; }

    #mainWrap { margin-left: 0 !important; }

function toast(msg, type='info') {
  const colors = { info: 'bg-navy', success: 'bg-green', error: 'bg-red' };
  const el = document.createElement('div');
  el.className = `toast ${colors[type]} text-white text-sm px-4 py-2.5 rounded-lg shadow-xl`;

// ---------------- Sidebar / Nav ----------------
function buildNav() {
  const nav = document.getElementById('navList');
  nav.innerHTML = NAV_ITEMS.map(item => `
    <button class="navlink w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-blue-50/90 ${item.id===currentPage?'active text-white':''}" data-nav="${item.id}" onclick="navigate('${item.id}')">

      <span class="nav-label">${item.label}</span>
    </button>`).join('');
  refreshIcons();
}

function navigate(pageId) {
  currentPage = pageId;
  document.querySelectorAll('.navlink').forEach(b => b.classList.toggle('active', b.dataset.nav === pageId));
  const item = NAV_ITEMS.find(n => n.id === pageId);
  document.getElementById('pageBreadcrumb').textContent = item ? item.label : '';
  renderPage(pageId);
  closeMobileSidebar();
  window.scrollTo({top:0, behavior:'smooth'});
}

function toggleSidebar() {
  if (window.innerWidth < 1024) {
    document.getElementById('sidebar').classList.toggle('mobile-open');
    document.getElementById('drawerOverlay').classList.toggle('hidden');
    return;
  }
  sidebarCollapsed = !sidebarCollapsed;
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('sidebar-collapsed', sidebarCollapsed);
  document.getElementById('mainWrap').style.marginLeft = sidebarCollapsed ? '76px' : '260px';
}
function closeMobileSidebar() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('drawerOverlay').classList.add('hidden');
}

function updateDateTime() {
  const el = document.getElementById('headerDateTime');
  const now = new Date();
  const opts = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  const time = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  el.textContent = `${now.toLocaleDateString('en-IN', opts)} · ${time}`;
}

function riskTag(risk) {

function priorityTag(p) {

function renderKPIs() {
  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = KPI_DATA.map((k,i)=>`
    <div class="card p-4 hoverable">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center mb-3" style="background:${colorBgSoft(k.color)}; color:${colorSolid(k.color)}">${icon(k.icon,'w-[18px] h-[18px]')}</div>
      <div class="text-[12px] text-muted leading-tight mb-1">${k.label}</div>
      <div class="kpi-value font-display font-extrabold text-xl lg:text-2xl text-navy" id="kpiVal${i}">0</div>
      ${k.trend!==null ? `<div class="flex items-center gap-1 mt-1 text-xs font-semibold ${trendColor(k)}">
          ${icon(k.trendDir==='up'?'arrow-up':'arrow-down','w-3.5 h-3.5')} ${k.trend}%
        </div>` : `<span class="tag bg-yellow/20 text-[#8a6d1a] mt-1 inline-block">${k.context}</span>`}
      ${k.trend!==null ? `<div class="text-[11px] text-muted mt-0.5">${k.context}</div>` : ''}
    </div>`).join('');
  KPI_DATA.forEach((k,i)=>animateKPI(i,k));
}
function colorBgSoft(c){ return {blue:'#EAF5FF',green:'#EAF8EF',red:'#FDECEC',yellow:'#FDF6E3'}[c]; }
function colorSolid(c){ return {blue:'#1683D8',green:'#27AE60',red:'#EB5757',yellow:'#c99a1f'}[c]; }
function trendColor(k){ return k.trendGood ? 'text-green' : (k.trendDir==='up' && !k.trendGood ? 'text-orange' : 'text-red'); }

function animateKPI(i, k) {
  const el = document.getElementById('kpiVal'+i);
  const target = k.value; const dur = 900; const start = performance.now();
  function step(t) {
    const p = Math.min(1, (t-start)/dur);
    const val = target * (1 - Math.pow(1-p, 3));
    el.textContent = (Number.isInteger(target) ? Math.round(val) : val.toFixed(1)) + (k.unit ? ' '+k.unit : '');
    if (p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderDistrictMap() {
  const svg = document.getElementById('districtMap');
  svg.innerHTML = DISTRICTS.map(d => `
    <path class="district-shape ${d.name===selectedDistrict.name?'selected':''}" data-name="${d.name}" d="${d.path}" fill="${RISK_COLORS[d.risk]}" fill-opacity="0.88" onclick="selectDistrictByName('${d.name}')"></path>
  `).join('') + DISTRICTS.map(d => {
    const c = pathCentroid(d.path);
    return `<text x="${c.x}" y="${c.y}" text-anchor="middle" fill="#062A4D" font-size="12" font-weight="600" style="pointer-events:none; paint-order: stroke; stroke: white; stroke-width: 3px;">${d.name}</text>`;
  }).join('');
}
function pathCentroid(path) {
  const nums = path.match(/-?\d+(\.\d+)?/g).map(Number);
  let xs=[], ys=[];
  for (let i=0;i<nums.length;i+=2){ xs.push(nums[i]); ys.push(nums[i+1]); }
  return { x: xs.reduce((a,b)=>a+b,0)/xs.length, y: ys.reduce((a,b)=>a+b,0)/ys.length };
}
function selectDistrictByName(name) {
  const d = DISTRICTS.find(x=>x.name===name);
  if (d) selectDistrict(d);

function renderHarvesting(host) {
  host.innerHTML = `
  <div class="card p-4 lg:p-5 mb-4">
    ${sectionHeader('Rainwater Harvesting Calculator','Estimate harvestable rainwater, storage needs and recharge potential')}
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="space-y-3">
        <div><label class="text-xs text-muted">Roof Area (sq ft)</label><input id="rwRoof" type="number" value="2000" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" oninput="calcHarvesting()"/></div>
        <div><label class="text-xs text-muted">Annual Rainfall (mm)</label><input id="rwRain" type="number" value="750" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" oninput="calcHarvesting()"/></div>
        <div><label class="text-xs text-muted">Runoff Coefficient</label><input id="rwRunoff" type="number" step="0.05" value="0.85" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" oninput="calcHarvesting()"/></div>
        <div><label class="text-xs text-muted">Number of Buildings</label><input id="rwBuildings" type="number" value="1" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" oninput="calcHarvesting()"/></div>
      </div>
      <div id="rwResult" class="bg-blueLight rounded-xl p-5"></div>
    </div>
  </div>`;
  calcHarvesting();
}
function calcHarvesting() {
  const roof = parseFloat(document.getElementById('rwRoof').value)||0;
  const rain = parseFloat(document.getElementById('rwRain').value)||0;
  const runoff = parseFloat(document.getElementById('rwRunoff').value)||0;
  const buildings = parseFloat(document.getElementById('rwBuildings').value)||1;
  const roofM2 = roof * 0.0929;
  const litresPerBuilding = roofM2 * (rain/1000) * runoff * 1000;
  const totalLitres = litresPerBuilding * buildings;
  const totalML = totalLitres/1000000;
  const storage = totalLitres * 0.15;
  const recharge = totalLitres * 0.4;
  const savings = (totalLitres/1000) * 0.05;
  document.getElementById('rwResult').innerHTML = `
    <div class="text-xs text-muted mb-1">Estimated Annual Harvest</div>
    <div class="font-display font-extrabold text-2xl text-blue mb-3">~${totalML.toFixed(2)} million litres/year</div>
    <div class="space-y-2 text-sm">
      <div class="flex justify-between"><span class="text-muted">Recommended Storage Capacity</span><span class="font-semibold">${Math.round(storage).toLocaleString()} L</span></div>
      <div class="flex justify-between"><span class="text-muted">Potential Groundwater Recharge</span><span class="font-semibold">${Math.round(recharge).toLocaleString()} L</span></div>
      <div class="flex justify-between"><span class="text-muted">Est. Water Bill Savings</span><span class="font-semibold">₹${Math.round(savings).toLocaleString()}/year</span></div>
    </div>
    ${sourceNote('IMD Rainfall Normals (simulated)','2025-09-10',95)}
  `;
}

  host.innerHTML = `

        ${simSlider('simRecharge','Recharge Structures',0,100,25,'%')}
      </div>
      <button onclick="runSimulation()" class="mt-5 w-full bg-blue text-white text-sm font-semibold py-2.5 rounded-lg flex items-center justify-center gap-2">${icon('play','w-4 h-4')} Run Simulation</button>

      </div>
      <div class="card p-4 lg:p-5">
        <h3 class="font-display font-bold text-navy mb-3">Before vs After — Groundwater Level</h3>
        <canvas id="simChart" height="180"></canvas>
      </div>
    </div>
  </div>`;
  runSimulation();
}
function simSlider(id, label, min, max, val, unit) {
  return `<div>
    <label class="text-xs text-muted flex justify-between mb-1">${label} <span id="${id}Val" class="font-semibold text-txt">${val>0?'+':''}${val}${unit}</span></label>
    <input type="range" id="${id}" min="${min}" max="${max}" value="${val}" class="w-full" oninput="document.getElementById('${id}Val').textContent=(this.value>0?'+':'')+this.value+'${unit}'"/>
  </div>`;
}
function runSimulation() {
  const extraction = +document.getElementById('simExtraction').value;
  const rainfall = +document.getElementById('simRainfall').value;
  const population = +document.getElementById('simPopulation').value;
  const agri = +document.getElementById('simAgri').value;
  const industrial = +document.getElementById('simIndustrial').value;
  const recharge = +document.getElementById('simRecharge').value;

  const levelImprove = (-extraction*0.03) + (rainfall*0.02) + (recharge*0.025) - (population*0.01) - (agri*0.01) - (industrial*0.008);
  const newLevel = (24.8 - levelImprove).toFixed(1);
  const deficitChange = Math.round((-recharge*0.6) + (extraction*0.9) - (rainfall*0.4) + (agri*0.3) + (industrial*0.2));
  const newSecurity = Math.max(0, Math.min(100, Math.round(68 + levelImprove*4 - deficitChange*0.15)));
  const criticalBefore = 12;
  const criticalAfter = Math.max(0, Math.round(12 - levelImprove*2 + deficitChange*0.05));

  document.getElementById('simOutcome').innerHTML = `
    ${outcomeTile('Groundwater Level', `${levelImprove>=0?'Improves':'Worsens'} by ${Math.abs(levelImprove).toFixed(1)} m`, levelImprove>=0?'green':'red')}
    ${outcomeTile('Water Deficit', `${deficitChange<=0?'':'+'}${deficitChange}%`, deficitChange<=0?'green':'red')}
    ${outcomeTile('Water Security', `68 → ${newSecurity}`, newSecurity>=68?'green':'red')}
    ${outcomeTile('Critical Areas', `12 → ${criticalAfter}`, criticalAfter<=12?'green':'red')}
  `;
  destroyChart('sim');
  chartRegistry['sim'] = new Chart(document.getElementById('simChart'), {
    type:'line',
    data:{ labels:['2025','2026','2027','2028','2029','2030'],
      datasets:[
        { label:'Baseline', data:[24.8,25.9,27.0,28.1,29.6,30.8], borderColor:'#94a3b8', borderDash:[5,4], tension:.3 },
        { label:'Simulated Scenario', data:[24.8, +(24.8-levelImprove*0.2).toFixed(1), +(24.8-levelImprove*0.4).toFixed(1), +(24.8-levelImprove*0.6).toFixed(1), +(24.8-levelImprove*0.8).toFixed(1), +newLevel], borderColor:'#1683D8', backgroundColor:'rgba(22,131,216,0.08)', fill:true, tension:.3 },
      ]},
    options:{ plugins:{legend:{position:'bottom'}}, scales:{y:{reverse:true, title:{display:true,text:'Depth (m)'}}} }
  });
}
function outcomeTile(label, value, color) {
  return `<div class="rounded-xl p-3.5" style="background:${colorBgSoft(color)}"><div class="text-xs text-muted">${label}</div><div class="font-display font-bold text-base mt-0.5" style="color:${colorSolid(color)}">${value}</div></div>`;
}

// ============================================================
// AI Chat Widget (floating)
// ============================================================
let aiChatOpen = false;
let aiHistoryInit = false;
function toggleAIChat(forceOpen) {
  aiChatOpen = forceOpen===true ? true : !aiChatOpen;
  const panel = document.getElementById('aiChatPanel');
  panel.classList.toggle('hidden', !aiChatOpen);
  panel.classList.toggle('flex', aiChatOpen);
  if (aiChatOpen && !aiHistoryInit) {
    aiHistoryInit = true;
    addAIMessage('bot', "Namaste! I'm JalSuraksha AI. Ask me about groundwater risk, crops, recharge sites, or rainwater harvesting.");
    renderAIQuickPrompts();
  }
}
function renderAIQuickPrompts() {
  document.getElementById('aiQuickPrompts').innerHTML = AI_QA.slice(0,3).map(qa=>`
    <button onclick="document.getElementById('aiInput').value='${qa.q.replace(/'/g,"\\'")}'; sendAIMessage();" class="text-[11px] bg-blueLight text-blue px-2.5 py-1 rounded-full font-medium">${qa.q.length>28?qa.q.slice(0,26)+'…':qa.q}</button>`).join('');
}
function addAIMessage(who, text) {
  const wrap = document.getElementById('aiMessages');
  const bubble = document.createElement('div');
  if (who === 'user') {
    bubble.className = 'ml-auto max-w-[85%] bg-blue text-white rounded-2xl rounded-br-sm px-3.5 py-2';
    bubble.textContent = text;
  } else {
    bubble.className = 'mr-auto max-w-[90%] bg-slate-100 rounded-2xl rounded-bl-sm px-3.5 py-2';
    bubble.innerHTML = text;
  }
  wrap.appendChild(bubble);
  wrap.scrollTop = wrap.scrollHeight;
}
function sendAIMessage() {
  const input = document.getElementById('aiInput');
  const q = input.value.trim();
  if (!q) return;
  addAIMessage('user', q);
  input.value = '';
  setTimeout(() => {
    const match = AI_QA.find(qa => qa.q.toLowerCase() === q.toLowerCase()) ||
                  AI_QA.find(qa => q.toLowerCase().includes(qa.q.split(' ')[1]?.toLowerCase()||'###'));
    if (match) {
      addAIMessage('bot', `
        <div class="text-sm">${match.a}</div>
        <div class="text-[11px] text-muted mt-1.5">Data used: ${match.data}</div>
        <div class="text-[11px] text-muted">Confidence: ${match.confidence}%</div>
        <div class="text-[11px] font-semibold text-blue mt-1">Recommended action: ${match.action}</div>
      `);
    } else {
      addAIMessage('bot', `I don't have specific demo data for that yet, but based on general trends, I'd recommend checking the Groundwater Analysis or Risk &amp; Forecasting pages for related insights. <div class="text-[11px] text-muted mt-1.5">Confidence: 55%</div>`);
    }
  }, 500);
}
